channels:
  - conda-forge

dependencies:
  - python=3.12                   # 3.14 is too new for rpaframework / robotframework-browser
  - nodejs                        # needed by robotframework-browser (Playwright backend)
  - pip:
    - rpaframework==33.0.2        # https://rpaframework.org/releasenotes.html
    - robocorp==3.1.4             # https://pypi.org/project/robocorp
    - robocorp-browser==2.4.0     # https://pypi.org/project/robocorp-browser
    - robotframework-browser      # provides the `Browser` module; pin after first successful build
    - robocorp-truststore        # silences the native certificate store warning
    - beautifulsoup4
    - google-auth-oauthlib        # Gmail login (OAuth)
    - google-api-python-client    # Gmail API
    - python-dotenv               # reads .env

rccPostInstall:
  - rfbrowser init  